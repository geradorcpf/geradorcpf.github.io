baseURL = "https://geradordecpf.github.io/"
languageCode = "pt-BR"
defaultContentLanguage = "pt-br"
title = "Gerador de CPF"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Gerador de CPF online: gere um CPF válido e aleatório, com ou sem pontuação e por estado."
  # AdSense: preencha depois da aprovação (ex.: ca-pub-1234567890123456)
  adsenseClient = ""
  adSlotTop = ""
  adSlotBottom = ""

[params.author]
  # Kosong = memakai nama situs sebagai Organization. Isi nama Anda jika type = "Person".
  name = ""
  type = "Organization"

[[menus.main]]
  name = "Artigos"
  pageRef = "/artigos"
  weight = 1
[[menus.main]]
  name = "Sobre"
  pageRef = "/sobre"
  weight = 2
[[menus.main]]
  name = "Contato"
  pageRef = "/contato"
  weight = 3
[[menus.main]]
  name = "Política de Privacidade"
  pageRef = "/politica-de-privacidade"
  weight = 4

[markup.highlight]
  codeFences = false
  guessSyntax = false

[markup.goldmark.renderer]
  unsafe = true

[imaging]
  quality = 80
  hint = "photo"
